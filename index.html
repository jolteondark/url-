<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Mapless Web Preview</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Mapless migration practice</p>
      <h1>iPhone Safari playable preview</h1>
      <p class="muted">Safari上で実domainを段階接続中。BattleはM0193 Battle Core subsetを使用します。</p>
    </header>

    <section class="card status-card" aria-live="polite">
      <div><span>Day</span><strong id="day">1</strong></div>
      <div><span>Party</span><strong id="party">1 / 6</strong></div>
      <div><span>Bag</span><strong id="bag">0</strong></div>
      <div><span>Money</span><strong id="money">0</strong></div>
    </section>

    <section class="card">
      <h2>Day Board preview</h2>
      <div class="grid" id="board">
        <button data-action="explore">探索する</button>
        <button data-action="battle">戦闘する</button>
        <button data-action="capture">捕獲する</button>
        <button data-action="reward">報酬を受け取る</button>
        <button data-action="save">セーブ</button>
        <button data-action="load">ロード</button>
        <button data-action="next">次の日へ</button>
        <button data-action="reset" class="danger">リセット</button>
      </div>
    </section>

    <section class="card" id="battle-card" hidden>
      <h2>Wild PIKACHU appeared!</h2>
      <div class="battle-status">
        <div><span>EEVEE HP</span><strong id="player-hp">20 / 20</strong></div>
        <div><span>PIKACHU HP</span><strong id="foe-hp">20 / 20</strong></div>
      </div>
      <p class="muted" id="battle-message">技を選んでください。</p>
      <div class="grid" id="moves">
        <button data-move="TACKLE" data-damage="7" data-priority="0">たいあたり</button>
        <button data-move="QUICK_ATTACK" data-damage="5" data-priority="1">でんこうせっか</button>
        <button data-move="BITE" data-damage="6" data-priority="0">かみつく</button>
        <button data-move="SWIFT" data-damage="6" data-priority="0">スピードスター</button>
      </div>
    </section>

    <section class="card">
      <h2>イベントログ</h2>
      <ol id="log" class="log"></ol>
    </section>
  </main>
  <script type="module" src="./preview.js"></script>
</body>
</html>
