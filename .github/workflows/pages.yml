name: Deploy Mapless Safari Playable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check browser modules
        run: |
          node --check preview.js
          node --check runtime/browser-mapless-wild-encounter-runtime.js
          node --check runtime/browser-battle-round-runtime.js
          node --check runtime/battle-core-try-use-move.js
          node --check runtime/safari-playable-data.js
          node --check runtime/safari-playable-integration.js
      - name: Run playable vertical smoke
        run: node tests/runtime-smoke.mjs

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build public artifact
        run: |
          mkdir -p dist
          cp index.html style.css manifest.webmanifest preview.js domain-runtime.js battle-runtime.js runtime-source.json dist/
          cp -R runtime dist/runtime
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
