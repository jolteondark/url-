name: Deploy Mapless Safari Playable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check browser modules
        run: |
          node --check preview.js
          node --check party-panel-bridge.js
          node --check storage-panel-bridge.js
          node --check species-sprite-atlas-bridge.js
          node --check runtime/browser-mapless-wild-encounter-runtime.js
          node --check runtime/browser-battle-round-runtime.js
          node --check runtime/battle-core-try-use-move.js
          node --check runtime/safari-playable-data.js
          node --check runtime/safari-species-sprite-manifest.js
          node --check runtime/safari-species-sprite-atlas.js
          node --check runtime/mapless-dynamic-trainer-master.js
          node --check runtime/mapless-dynamic-trainer-generator.js
          node --check runtime/safari-playable-integration-core.js
          node --check runtime/safari-playable-integration.js
          node --check runtime/bag-economy-resolved-shop-transaction.js
          node --check runtime/facility-reward-return.js
          node --check runtime/facility-reward-bag-money-integration.js
      - name: Run playable vertical smoke
        run: |
          node tests/runtime-smoke.mjs
          node tests/facility-reward-smoke.mjs
          node tests/trainer-party-handoff-smoke.mjs
          node tests/resolved-shop-transaction-smoke.mjs
          node tests/species-sprite-atlas-smoke.mjs

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build public artifact
        run: |
          mkdir -p dist
          cp index.html *.css *.js runtime-source.json manifest.webmanifest dist/
          cp -R runtime dist/runtime
          cp -R assets dist/assets
          test -f dist/species-sprite-atlas-bridge.js
          test -f dist/runtime/safari-species-sprite-atlas.js
          test -f dist/assets/general-front12/front-00.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
